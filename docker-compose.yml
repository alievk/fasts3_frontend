services:
  bot:
    image: node:20-alpine
    working_dir: /app
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - .:/app
      - telegram_bot_node_modules:/app/node_modules
    command: >
      sh -c "npm install --no-audit --no-fund && npm run bot"
    profiles: ["prod"]

  bot-dev:
    image: node:20-alpine
    working_dir: /app
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
      TELEGRAM_BOT_TOKEN: 8569009509:AAEjzCtTRFu4T8aoLTspuWt-V3KNS6z2Aks
    volumes:
      - .:/app
      - telegram_bot_node_modules:/app/node_modules
    command: >
      sh -c "npm install --no-audit --no-fund && npm run bot"
    profiles: ["dev"]

  player:
    image: node:20-alpine
    working_dir: /app
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - .:/app
      - player_node_modules:/app/node_modules
    ports:
      - "8080:8080"
    command: >
      sh -c "npm install --no-audit --no-fund && npm run serve-player"

  webhook:
    image: node:20-alpine
    working_dir: /app
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - .:/app
      - webhook_node_modules:/app/node_modules
    ports:
      - "8040:8040"
    command: >
      sh -c "npm install --no-audit --no-fund && npm run webhook-server"

volumes:
  telegram_bot_node_modules:
  player_node_modules:
  webhook_node_modules:
