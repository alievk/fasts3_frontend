services:
  bot:
    image: node:20-alpine
    working_dir: /app
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - .:/app
      - telegram_bot_node_modules:/app/node_modules
    command: >
      sh -c "npm install --no-audit --no-fund && npm run bot"

  bot-fake:
    extends:
      service: bot
    environment:
      TELEGRAM_BOT_TOKEN: 8470570517:AAESl-V5QrI28i1_gs3JqQJTmF6RVWT1pjU
      TELEGRAM_LOCALE: bot_fake

  player:
    image: node:20-alpine
    working_dir: /app
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - .:/app
      - player_node_modules:/app/node_modules
    ports:
      - "8080:8080"
    command: >
      sh -c "npm install --no-audit --no-fund && npm run serve-player"

  webhook:
    image: node:20-alpine
    working_dir: /app
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - .:/app
      - webhook_node_modules:/app/node_modules
    ports:
      - "8040:8040"
    command: >
      sh -c "npm install --no-audit --no-fund && npm run webhook-server"

volumes:
  telegram_bot_node_modules:
  player_node_modules:
  webhook_node_modules:
